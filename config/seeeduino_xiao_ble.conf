# Name displayed during Bluetooth scan
CONFIG_ZMK_KEYBOARD_NAME="Left Gamepad"

# Standalone mode
CONFIG_ZMK_SPLIT=n

# Enable Bluetooth & Power Management
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SLEEP=y

# Bypass PIN/Passkey entry during pairing
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Boost Bluetooth transmit power to maximum (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Experimental features for improved Bluetooth stability
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Enable Mouse Keys & Acceleration
CONFIG_ZMK_MOUSE=y
# Increase max speed and acceleration rate
CONFIG_ZMK_MOUSE_TICK_DURATION=8
CONFIG_ZMK_MOUSE_WORK_QUEUE_DEDICATED=y
